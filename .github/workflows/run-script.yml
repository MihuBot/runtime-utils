name: Run MihuBot script

on:
  issues:
    types: [opened]

jobs:
  run-windows:
    if: (github.actor == 'MihuBot' || github.actor == 'MihaZupan') && contains(github.event.issue.body, 'RUN_AS_GITHUB_ACTION_') && !contains(github.event.issue.title, 'ARM64')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 11.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0'
          dotnet-quality: 'daily'

      - name: Run script
        shell: pwsh
        env:
          RUNTIME_UTILS_TOKEN: ${{ secrets.RUNTIME_UTILS_TOKEN }}
        run: |
          # The runner uses its working directory as scratch space (it clones dotnet/runtime
          # into it), so keep that out of the project directory.
          New-Item -ItemType Directory -Force -Path ../runner-work
          cd ../runner-work
          dotnet run -c Release --project "$env:GITHUB_WORKSPACE/Runner" "${{ github.event_path }}"

  run-windows-arm:
    if: (github.actor == 'MihuBot' || github.actor == 'MihaZupan') && contains(github.event.issue.body, 'RUN_AS_GITHUB_ACTION_') && contains(github.event.issue.title, 'ARM64')
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 11.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0'
          dotnet-quality: 'daily'

      - name: Run script
        shell: pwsh
        env:
          RUNTIME_UTILS_TOKEN: ${{ secrets.RUNTIME_UTILS_TOKEN }}
        run: |
          # The runner uses its working directory as scratch space (it clones dotnet/runtime
          # into it), so keep that out of the project directory.
          New-Item -ItemType Directory -Force -Path ../runner-work
          cd ../runner-work
          dotnet run -c Release --project "$env:GITHUB_WORKSPACE/Runner" "${{ github.event_path }}"
